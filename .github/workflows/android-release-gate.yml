name: Android release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Generate source
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test Flutter code
        run: flutter test

      - name: Create ephemeral CI signing key
        env:
          CI_KEYSTORE_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/customer-release.jks" \
            -storepass "$CI_KEYSTORE_PASSWORD" \
            -keypass "$CI_KEYSTORE_PASSWORD" \
            -alias customer-release \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Customer CI,O=Customer,C=CN"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/customer-release.jks
          storePassword=$CI_KEYSTORE_PASSWORD
          keyAlias=customer-release
          keyPassword=$CI_KEYSTORE_PASSWORD
          EOF

      - name: Test Android application code
        working-directory: android
        run: ./gradlew :app:testReleaseUnitTest

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Reject debug-signed artifacts
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/cert.txt
          ! grep -q "Android Debug" /tmp/cert.txt

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-release-candidate
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
