name: customer
description: "客户跟进助手 - 单人本地使用的客户管理与跟进提醒工具"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

# 全部依赖写死版本，不使用 ^ 范围。
# 单人维护的项目，最不需要的是某天 pub get 之后突然编译不过。
#
# 本组合由 pub 求解器在 Flutter 3.44.8 / Dart 3.12.2 下实际求解得出，
# 是当前环境可共存的最新版本集合。详见 docs/TECH_STACK.md 第 3 节。
dependencies:
  flutter:
    sdk: flutter

  # 状态管理与路由
  # riverpod 停在 3.3.2 而非 3.4.2：3.4.2 的传递依赖与 drift_dev 的
  # analyzer 约束冲突。3.3.2 同属 3.x，API 与架构一致。
  flutter_riverpod: 3.3.2
  riverpod_annotation: 4.0.3
  go_router: 17.3.0

  # 数据库
  # 不使用 sqlite3_flutter_libs，它已 EOL。sqlite3 3.x 已内置原生库。
  drift: 2.34.3
  sqlite3: 3.5.0
  path_provider: 2.1.6
  path: 1.9.1

  # 提醒
  flutter_local_notifications: 22.2.0
  android_alarm_manager_plus: 5.1.1
  timezone: 0.11.1
  permission_handler: 13.0.0

  # 附件
  # 不使用 file_picker：其稳定版 11.0.3 仍依赖 win32 5.x，与 share_plus 13.x
  # 和 device_info_plus 13.x 所需的 win32 6.x 冲突。文档选择改用原生 intent。
  image_picker: 1.2.3
  flutter_image_compress: 2.5.1
  photo_view: 0.15.0
  open_filex: 4.7.0

  # 导出与备份
  # archive 停在 3.6.1：excel 4.0.6 依赖 archive ^3.6.1。3.x 的 ZipEncoder
  # 已满足备份 zip 打包需求。
  archive: 3.6.1
  excel: 4.0.6
  xml: 6.6.1
  share_plus: 13.3.0

  # 工具
  intl: 0.20.3
  url_launcher: 6.3.2
  flutter_contacts: 2.3.1
  device_info_plus: 13.2.0
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # build_runner 停在 2.15.1：2.15.2+ 要求 analyzer >=13.3.0，而 analyzer
  # >=13.1.0 需要 meta ^1.18.3，与 flutter_test 钉死的 meta 1.18.0 冲突。
  build_runner: 2.15.1
  # drift_dev 停在 2.34.0，配合下方 dependency_overrides 锁 sqlparser 0.44.5。
  # 2.34.1+ 要求 analyzer ^13.0.0，而 analyzer >=13.1.0 需要 meta ^1.18.3，
  # 与 flutter_test 钉死的 meta 1.18.0 冲突，整条链走不通。
  drift_dev: 2.34.0
  riverpod_generator: 4.0.4
  riverpod_lint: 3.1.4
  flutter_lints: 6.0.0

# sqlparser 0.44.6 移除了 DartPlaceholder.when，但 drift_dev 2.34.0 仍在调用它，
# 而 drift_dev 声明的约束是 ^0.44.0，会解析到 0.44.6 并导致 build_runner
# 编译构建脚本失败。上游把破坏性变更发在了补丁号上，只能在这里锁死。
# 待 flutter_test 放开 meta 1.18.0 之后，可整体升到 drift_dev 2.34.5 移除本节。
dependency_overrides:
  sqlparser: 0.44.5

flutter:
  uses-material-design: true
